version: "3.9"

services:
  backend:
    build: ./backend
    container_name: billing_backend
    environment:
      - SQLALCHEMY_DATABASE_URI=sqlite:///app/billing.db
    ports:
      - "8000:8000"
    volumes:
      - ./backend/billing.db:/app/billing.db

  frontend:
    build: ./frontend
    container_name: billing_frontend
    depends_on:
      - backend
    ports:
      - "80:80"
